<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazo – النهائي</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin:0; font-family:Arial; background:#1a1a2e; color:white; text-align:center; }
        #loginBox { padding:50px; }
        #appBox { display:none; height:100vh; }
        #map { height:90vh; width:100%; }
        input, button { padding:10px 20px; margin:5px; border-radius:8px; border:none; }
        button { background:#4CAF50; color:white; cursor:pointer; }
        #topBar { background:#0f0f0f; padding:10px; display:flex; justify-content:space-between; align-items:center; }
        .action-btn { background:transparent; border:none; font-size:18px; cursor:pointer; padding:0 5px; }
        .like-btn { color:#ff4757; }
        .comment-btn { color:#1e90ff; }
        .delete-btn { color:#ff6348; }
        .popup-text { font-size:14px; line-height:1.8; text-align:center; min-width:200px; color:#333; }
        .likes-count { color:#ff4757; font-weight:bold; }
        .comment-box { background:#f0f0f0; color:#333; padding:5px 10px; border-radius:5px; margin:5px 0; font-size:13px; text-align:left; }
        .custom-div-icon { background:transparent !important; border:none !important; display:flex !important; align-items:center !important; justify-content:center !important; }
        .leaflet-marker-icon.custom-div-icon { background:transparent !important; border:none !important; }
        @keyframes popIn { 0%{transform:scale(0.5);opacity:0;} 80%{transform:scale(1.05);} 100%{transform:scale(1);opacity:1;} }
        .marker-animate { animation:popIn 0.4s ease forwards; }
        #profilePage { display:none; padding:20px; text-align:left; max-width:600px; margin:auto; height:90vh; overflow-y:auto; }
        .profile-item { background:#2d2d44; padding:10px; margin:8px 0; border-radius:8px; border-left:4px solid #4CAF50; }
        .profile-item small { color:#aaa; }
        .back-btn { background:#555; }
        .profile-avatar { width:80px; height:80px; border-radius:50%; border:3px solid #4CAF50; object-fit:cover; display:block; margin:0 auto 10px; }
        .profile-field { background:#2d2d44; padding:12px; border-radius:8px; margin:10px 0; }
        .profile-field label { display:block; font-weight:bold; color:#aaa; font-size:12px; margin-bottom:3px; }
        .profile-field input, .profile-field textarea { width:100%; max-width:300px; padding:8px; border-radius:5px; border:1px solid #555; background:#1a1a2e; color:white; }
        .theme-toggle { background:transparent; border:none; font-size:24px; cursor:pointer; padding:5px 10px; }
    </style>
</head>
<body>
    <!-- ===== تسجيل الدخول ===== -->
    <div id="loginBox">
        <h1>🔐 Bazo</h1>
        <input id="email" placeholder="البريد الإلكتروني"><br>
        <input id="password" type="password" placeholder="كلمة المرور"><br>
        <button onclick="signup()">إنشاء حساب</button>
        <button onclick="login()">تسجيل دخول</button>
        <p id="status"></p>
    </div>

    <!-- ===== التطبيق ===== -->
    <div id="appBox">
        <div id="topBar">
            <h2>🌍 Bazo</h2>
            <div>
                <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
                <button onclick="showProfile()">👤 حسابي</button>
                <button onclick="logout()">تسجيل خروج</button>
            </div>
        </div>
        <div id="map"></div>
        <!-- ===== صفحة الملف الشخصي ===== -->
        <div id="profilePage">
            <button onclick="goToMap()" class="back-btn">🔙 رجوع للخريطة</button>
            <h2>👤 الملف الشخصي</h2>
            <img id="profileAvatar" class="profile-avatar" src="https://ui-avatars.com/api/?name=مستخدم&background=4CAF50&color=fff&size=80" alt="صورة">
            <div class="profile-field"><label>اسم المستخدم</label><input id="profileUsername" placeholder="اكتب اسمك"></div>
            <div class="profile-field"><label>نبذة عنك</label><textarea id="profileBio" placeholder="اكتب نبذة عنك..."></textarea></div>
            <div class="profile-field"><label>العمر</label><input id="profileAge" type="number" placeholder="مثلاً: 25"></div>
            <div class="profile-field"><label>المدينة/الدولة</label><input id="profileLocation" placeholder="مثلاً: دبي، الإمارات"></div>
            <div class="profile-field"><label>روابط حساباتك</label><input id="profileSocial" placeholder="فيسبوك, تويتر, إنستغرام (بينهم فاصلة)"></div>
            <button onclick="saveProfile()" style="background:#2196F3;">💾 حفظ</button>
            <button onclick="resetProfile()" style="background:#f44336;">🔄 إعادة تعيين</button>
            <hr>
            <h3>📝 رسائلي</h3>
            <div id="profileMessages"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        // ===== إعدادات Firebase =====
        var firebaseConfig = {
            apiKey: "AIzaSyBS70yDWhJy0Dyga40Uhi4L1m_4017Fe6c",
            authDomain: "bazo-a36fe.firebaseapp.com",
            databaseURL: "https://bazo-a36fe-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bazo-a36fe",
            storageBucket: "bazo-a36fe.firebasestorage.app",
            messagingSenderId: "91348188690",
            appId: "1:91348188690:web:32769b1826e9aa0b8f22cb",
            measurementId: "G-ES9JXGH44V"
        };
        firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();

        // ===== متغيرات وأيقونات =====
        var map, currentUser = null;

        var redIcon = L.divIcon({
            className: 'custom-div-icon',
            html: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#ff4757" stroke="white" stroke-width="1.5"/></svg>`,
            iconSize: [32, 32],
            iconAnchor: [16, 32],
            popupAnchor: [1, -30]
        });
        var blueIcon = L.divIcon({
            className: 'custom-div-icon',
            html: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#1e90ff" stroke="white" stroke-width="1.5"/></svg>`,
            iconSize: [32, 32],
            iconAnchor: [16, 32],
            popupAnchor: [1, -30]
        });

        // ===== دوال الحساب =====
        window.signup = function() {
            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;
            auth.createUserWithEmailAndPassword(email, password)
                .then(function() { document.getElementById("status").innerText = "✅ تم إنشاء الحساب"; })
                .catch(function(e) { alert(e.message); });
        };
        window.login = function() {
            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;
            auth.signInWithEmailAndPassword(email, password)
                .then(function() { document.getElementById("status").innerText = "✅ تم تسجيل الدخول"; })
                .catch(function(e) { alert(e.message); });
        };
        window.logout = function() { auth.signOut(); };

        // ===== الوضع الليلي والتنقل =====
        window.goToMap = function() {
            document.getElementById("profilePage").style.display = "none";
            document.getElementById("map").style.display = "block";
            if (map) map.invalidateSize();
        };
        window.showProfile = function() {
            document.getElementById("map").style.display = "none";
            document.getElementById("profilePage").style.display = "block";
            loadProfile();
        };
        window.toggleTheme = function() {
            document.body.classList.toggle('light');
            var btn = document.getElementById('themeBtn');
            if (document.body.classList.contains('light')) {
                btn.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            } else {
                btn.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            }
        };
        (function() {
            var theme = localStorage.getItem('theme');
            if (theme === 'light') { document.body.classList.add('light'); document.getElementById('themeBtn').textContent = '☀️'; }
        })();

        auth.onAuthStateChanged(function(user) {
            currentUser = user;
            if (user) {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("appBox").style.display = "block";
                loadUserProfile();
                startMap(user);
            } else {
                document.getElementById("loginBox").style.display = "block";
                document.getElementById("appBox").style.display = "none";
            }
        });

        // ===== الملف الشخصي =====
        function loadUserProfile() {
            if (!currentUser) return;
            db.collection("users").doc(currentUser.uid).get().then(function(doc) {
                if (doc.exists) {
                    var data = doc.data();
                    document.getElementById("profileUsername").value = data.username || '';
                    document.getElementById("profileBio").value = data.bio || '';
                    document.getElementById("profileAge").value = data.age || '';
                    document.getElementById("profileLocation").value = data.location || '';
                    document.getElementById("profileSocial").value = data.socialLinks || '';
                    if (data.avatar) { document.getElementById("profileAvatar").src = data.avatar; }
                } else {
                    document.getElementById("profileUsername").value = currentUser.email.split('@')[0] || 'مستخدم';
                }
            });
        }
        window.saveProfile = function() {
            if (!currentUser) return;
            var username = document.getElementById("profileUsername").value.trim();
            if (!username) { alert("يرجى كتابة اسم المستخدم"); return; }
            db.collection("users").doc(currentUser.uid).set({
                username: username,
                bio: document.getElementById("profileBio").value.trim(),
                age: document.getElementById("profileAge").value,
                location: document.getElementById("profileLocation").value.trim(),
                socialLinks: document.getElementById("profileSocial").value.trim(),
                avatar: document.getElementById("profileAvatar").src,
                email: currentUser.email,
                updatedAt: new Date()
            }, { merge: true }).then(function() {
                alert("✅ تم الحفظ!");
                loadMessages();
            });
        };
        window.resetProfile = function() {
            if (!confirm("هل أنت متأكد؟")) return;
            db.collection("users").doc(currentUser.uid).delete().then(function() {
                document.getElementById("profileUsername").value = '';
                document.getElementById("profileBio").value = '';
                document.getElementById("profileAge").value = '';
                document.getElementById("profileLocation").value = '';
                document.getElementById("profileSocial").value = '';
                document.getElementById("profileAvatar").src = 'https://ui-avatars.com/api/?name=مستخدم&background=4CAF50&color=fff&size=80';
                alert("🔄 تم إعادة التعيين");
            });
        };
        function loadProfile() {
            if (!currentUser) return;
            db.collection("users").doc(currentUser.uid).get().then(function(doc) {
                if (doc.exists) {
                    var data = doc.data();
                    var username = data.username || currentUser.email.split('@')[0];
                    document.querySelector('#profilePage h2').innerHTML = '👤 ' + username;
                }
            });
            db.collection("messages").where("uid", "==", currentUser.uid).get()
                .then(function(snapshot) {
                    var count = 0, totalLikes = 0, html = "";
                    snapshot.forEach(function(doc) {
                        var data = doc.data();
                        count++;
                        totalLikes += (data.likes || 0);
                        html += '<div class="profile-item"><b>' + data.message + '</b><br><small>📍 ' + data.latitude.toFixed(4) + ', ' + data.longitude.toFixed(4) + '</small><br><small>❤️ ' + (data.likes || 0) + ' إعجاب</small></div>';
                    });
                    document.getElementById("profileCount").innerHTML = '<strong>عدد رسائلي:</strong> ' + count;
                    document.getElementById("profileLikes").innerHTML = '<strong>❤️ إجمالي الإعجابات:</strong> ' + totalLikes;
                    document.getElementById("profileMessages").innerHTML = html || "لا توجد رسائل بعد.";
                });
        }

        // ===== دوال المساعدة والتفاعل =====
        function getUsername(callback) {
            if (!currentUser) { callback('مجهول'); return; }
            db.collection("users").doc(currentUser.uid).get().then(function(doc) {
                if (doc.exists && doc.data().username) { callback(doc.data().username); } 
                else { callback(currentUser.email.split('@')[0]); }
            });
        }

        window.toggleLike = function(docId) {
            if (!currentUser) { alert("يجب تسجيل الدخول"); return; }
            var docRef = db.collection("messages").doc(docId);
            docRef.get().then(function(doc) {
                if (!doc.exists) return;
                var data = doc.data();
                var likedBy = data.likedBy || [];
                var index = likedBy.indexOf(currentUser.uid);
                var newLikes = data.likes || 0;
                if (index > -1) { likedBy.splice(index, 1); newLikes--; } else { likedBy.push(currentUser.uid); newLikes++; }
                docRef.update({ likes: newLikes, likedBy: likedBy }).then(function() { loadMessages(); });
            });
        };
        window.deleteMessage = function(docId, authorUid) {
            if (!currentUser) return;
            if (currentUser.uid !== authorUid) { alert("ليس لديك صلاحية"); return; }
            if (!confirm("هل أنت متأكد؟")) return;
            db.collection("messages").doc(docId).delete().then(function() { loadMessages(); });
        };
        window.addComment = function(docId) {
            if (!currentUser) { alert("يجب تسجيل الدخول"); return; }
            var commentText = prompt("💬 اكتب تعليقك:");
            if (!commentText) return;
            getUsername(function(username) {
                db.collection("messages").doc(docId).collection("comments").add({
                    uid: currentUser.uid,
                    username: username || 'مجهول',
                    text: commentText,
                    createdAt: new Date()
                }).then(function() { loadMessages(); });
            });
        };

        // ===== دوال الخريطة =====
        function startMap(user) {
            if (map) { map.remove(); }
            map = L.map('map', {
                center: [20, 0],
                zoom: 2,
                minZoom: 1,
                maxZoom: 18,
                maxBounds: [[-85, -180], [85, 180]],
                maxBoundsViscosity: 0.5
            });

            L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                noWrap: true,
                minZoom: 1,
                maxZoom: 18
            }).addTo(map);

            navigator.geolocation.getCurrentPosition(function(pos) {
                var lat = pos.coords.latitude;
                var lng = pos.coords.longitude;
                map.setView([lat, lng], 13);
                L.marker([lat, lng], {icon: blueIcon}).addTo(map).bindPopup('📍 أنت هنا');
            }, function() {
                alert('لم نتمكن من جلب موقعك، لكنك تقدر تختار أي مكان.');
            });

            // ===== حدث كتابة رسالة جديدة =====
            map.on('click', function(e) {
                var lat = e.latlng.lat;
                var lng = e.latlng.lng;
                var msg = prompt('✍️ اكتب رسالتك لهذا المكان:');
                if (!msg) return;

                getUsername(function(username) {
                    db.collection("messages").add({
                        uid: user.uid,
                        username: username || user.email.split('@')[0],
                        latitude: lat,
                        longitude: lng,
                        message: msg,
                        createdAt: new Date(),
                        likes: 0,
                        likedBy: []
                    })
                    .then(function() {
                        alert('✅ تم حفظ رسالتك!');
                        // ===== نضيف الدبوس الجديد مباشرة =====
                        var marker = L.marker([lat, lng], {icon: redIcon}).addTo(map);
                        marker.bindPopup("<b>" + (username || user.email) + "</b><br>" + msg);
                        // ===== نعيد تحميل الرسائل لتحديث العدد والإعجابات =====
                        loadMessages();
                    })
                    .catch(function(err) {
                        alert('❌ فشل الحفظ: ' + err.message);
                    });
                });
            });

            loadMessages();
        }

        function loadMessages() {
            map.eachLayer(function(layer) {
                if (!!layer.getPopup || !!layer._popup) {
                    map.removeLayer(layer);
                }
            });

            L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                noWrap: true,
                minZoom: 1,
                maxZoom: 18
            }).addTo(map);

            navigator.geolocation.getCurrentPosition(function(pos) {
                var lat = pos.coords.latitude;
                var lng = pos.coords.longitude;
                L.marker([lat, lng], {icon: blueIcon}).addTo(map).bindPopup('📍 أنت هنا');
            }, function() {});

            db.collection("messages").get()
                .then(function(snapshot) {
                    snapshot.forEach(function(doc) {
                        var data = doc.data();
                        var docId = doc.id;
                        if (data.latitude && data.longitude && data.latitude !== 0 && data.longitude !== 0) {
                            var likes = data.likes || 0;
                            var isOwner = (currentUser && currentUser.uid === data.uid);

                            var popupContent =
                                '<div class="popup-text">' +
                                '<b>' + (data.username || 'مجهول') + '</b><br>' +
                                data.message + '<br>' +
                                '<span class="likes-count">❤️ ' + likes + '</span>' +
                                ' <button class="action-btn like-btn" onclick="toggleLike(\'' + docId + '\')">👍</button>' +
                                ' <button class="action-btn comment-btn" onclick="addComment(\'' + docId + '\')">💬</button>' +
                                (isOwner ? ' <button class="action-btn delete-btn" onclick="deleteMessage(\'' + docId + '\', \'' + data.uid + '\')">🗑️</button>' : '') +
                                '<br><small>' + (data.createdAt?.toDate?.()?.toLocaleDateString('ar-EG') || '') + '</small>' +
                                '<hr style="margin:5px 0;">' +
                                '<div id="comments-' + docId + '" style="text-align:left;font-size:13px;max-height:100px;overflow-y:auto;"><i>⏳ جاري التحميل...</i></div>' +
                                '</div>';

                            var marker = L.marker([data.latitude, data.longitude], {icon: redIcon}).addTo(map);
                            if (marker._icon) marker._icon.classList.add('marker-animate');
                            marker.bindPopup(popupContent);

                            marker.on('popupopen', function() {
                                var container = document.getElementById('comments-' + docId);
                                if (container) {
                                    container.innerHTML = '<i>⏳ جاري التحميل...</i>';
                                    db.collection("messages").doc(docId).collection("comments")
                                        .orderBy("createdAt", "desc").limit(5).get()
                                        .then(function(commentSnap) {
                                            var html = "";
                                            if (commentSnap.empty) { html = '<i style="color:#888;">لا توجد تعليقات</i>'; } else {
                                                commentSnap.forEach(function(cDoc) {
                                                    var cData = cDoc.data();
                                                    html += '<div class="comment-box"><b>' + (cData.username || 'مجهول') + '</b>: ' + cData.text +
                                                        ' <small style="color:#999;">' + (cData.createdAt?.toDate?.()?.toLocaleDateString('ar-EG') || '') + '</small></div>';
                                                });
                                            }
                                            container.innerHTML = html;
                                        });
                                }
                            });
                        }
                    });
                })
                .catch(function(err) { console.error('خطأ في تحميل الرسائل:', err); });
        }
    </script>
</body>
</html>
