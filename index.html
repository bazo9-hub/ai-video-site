<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazo - كرة أرضية 3D</title>

<!-- ===== مكتبة Cesium (الكرة الأرضية) ===== -->
<script src="https://cesium.com/downloads/cesiumjs/releases/1.105/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.105/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

<style>
body{margin:0;font-family:Arial;background:#1a1a2e;color:white;text-align:center}
#loginBox{padding:50px}
#appBox{display:none;height:100vh}
#map{height:90vh;width:100%}
input,button{padding:10px 20px;margin:5px;border-radius:8px;border:none}
button{background:#4CAF50;color:white;cursor:pointer}
#topBar{background:#0f0f0f;padding:10px;display:flex;justify-content:space-between;align-items:center;text-align:left;padding-left:20px;padding-right:20px}
</style>
</head>
<body>

<!-- ===== تسجيل الدخول ===== -->
<div id="loginBox">
  <h1>🔐 Bazo</h1>
  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="كلمة السر"><br>
  <button onclick="signup()">إنشاء حساب</button>
  <button onclick="login()">تسجيل دخول</button>
  <p id="status"></p>
</div>

<!-- ===== التطبيق ===== -->
<div id="appBox">
  <div id="topBar">
    <h2>🌍 Bazo (3D Globe)</h2>
    <button onclick="logout()">تسجيل خروج</button>
  </div>
  <div id="map"></div>
</div>

<!-- ===== Firebase ===== -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
// ===== إعدادات Firebase =====
var firebaseConfig = {
  apiKey: "AIzaSyBS70yDWhJy0Dyga40Uhi4L1m_4017Fe6c",
  authDomain: "bazo-a36fe.firebaseapp.com",
  databaseURL: "https://bazo-a36fe-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bazo-a36fe",
  storageBucket: "bazo-a36fe.firebasestorage.app",
  messagingSenderId: "91348188690",
  appId: "1:91348188690:web:32769b1826e9aa0b8f22cb",
  measurementId: "G-ES9JXGH44V"
};

firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();

// ===== دوال تسجيل الدخول (معرفة بشكل صحيح) =====
window.signup = function() {
  var email = document.getElementById("email").value;
  var password = document.getElementById("password").value;
  auth.createUserWithEmailAndPassword(email, password)
    .then(function() {
      document.getElementById("status").innerText = "✅ تم إنشاء الحساب";
    })
    .catch(function(e) {
      alert(e.message);
    });
};

window.login = function() {
  var email = document.getElementById("email").value;
  var password = document.getElementById("password").value;
  auth.signInWithEmailAndPassword(email, password)
    .then(function() {
      document.getElementById("status").innerText = "✅ تم تسجيل الدخول";
    })
    .catch(function(e) {
      alert(e.message);
    });
};

window.logout = function() {
  auth.signOut();
};

// ===== متغير الكرة الأرضية =====
var viewer;

// ===== تبديل الواجهة =====
auth.onAuthStateChanged(function(user) {
  if (user) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("appBox").style.display = "block";
    startGlobe(user);
  } else {
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("appBox").style.display = "none";
  }
});

// ===== تشغيل الكرة الأرضية 3D =====
function startGlobe(user) {
  // نستخدم token عام (مجاني، لا يحتاج حساب، لكن محدود)
  Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI2NmU3NzA5MC0wMzgwLTRhMDItYjllNS0wY2I4YmUyMjUxNDIiLCJpZCI6MTUwMzc0LCJpYXQiOjE3MDU5MzUyNjl9.MVqU_4TtT7sDQp5QzFZs3Bj6h7gSQfZJkL5VpLqR1aM';

  viewer = new Cesium.Viewer('map', {
    globe: true,
    terrain: false,
    imageryProvider: new Cesium.TileMapServiceImageryProvider({
      url: Cesium.buildModuleUrl('Assets/Textures/NaturalEarthII')
    })
    // إخفاء الأدوات الزائدة
  viewer.animation.container.style.display = 'none';
  viewer.timeline.container.style.display = 'none';
  viewer.geocoder.container.style.display = 'none';
  viewer.homeButton.container.style.display = 'none';
  viewer.fullscreenButton.container.style.display = 'none';

  // ===== موقع المستخدم =====
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos) {
      var lng = pos.coords.longitude;
      var lat = pos.coords.latitude;
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(lng, lat, 2000000)
      });
      // إضافة نقطة الموقع
      viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(lng, lat),
        billboard: {
          image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="blue"%3E%3Cpath d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/%3E%3C/svg%3E',
          width: 32,
          height: 32
        },
        label: {
          text: '📍 أنت هنا',
          font: '14px sans-serif',
          fillColor: Cesium.Color.WHITE,
          backgroundColor: Cesium.Color.BLACK.withAlpha(0.7),
          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          outlineWidth: 2,
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
          pixelOffset: new Cesium.Cartesian2(0, -20)
        }
      });
    }, function() {
      alert('لم نتمكن من جلب موقعك، لكنك تقدر تختار أي مكان.');
    });
  }

  // ===== الضغط على الكرة الأرضية لكتابة رسالة =====
  viewer.screenSpaceEventHandler.setInputAction(function(click) {
    var ray = viewer.camera.getPickRay(click.position);
    var cartesian = viewer.scene.globe.pick(ray, viewer.scene);
    if (cartesian) {
      var cartographic = Cesium.Cartographic.fromCartesian(cartesian);
      var lat = Cesium.Math.toDegrees(cartographic.latitude);
      var lng = Cesium.Math.toDegrees(cartographic.longitude);

      var msg = prompt('✍️ اكتب رسالتك لهذا المكان:');
      if (!msg) return;

      db.collection("messages").add({
        uid: user.uid,
        username: user.email || 'مجهول',
        latitude: lat,
        longitude: lng,
        message: msg,
        createdAt: new Date()
      })
      .then(function() {
        alert('✅ تم حفظ رسالتك!');
        // إضافة العلامة الحمراء مع النص
        viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(lng, lat),
          billboard: {
            image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="red"%3E%3Cpath d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/%3E%3C/svg%3E',
            width: 32,
            height: 32
          },
          label: {
            text: user.email + '\n' + msg,
            font: '14px sans-serif',
            fillColor: Cesium.Color.WHITE,
            backgroundColor: Cesium.Color.BLACK.withAlpha(0.7),
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            outlineWidth: 2,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            pixelOffset: new Cesium.Cartesian2(0, -20)
          }
        });
      })
      .catch(function(err) {
        alert('❌ فشل الحفظ: ' + err.message);
      });
    }
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

  // ===== تحميل الرسائل القديمة =====
  loadMessages();
}

// ===== جلب الرسائل =====
function loadMessages() {
  db.collection("messages").get()
    .then(function(snapshot) {
      snapshot.forEach(function(doc) {
        var data = doc.data();
        if (data.latitude && data.longitude) {
          var text = data.username + '\n' + data.message;
          if (data.createdAt && data.createdAt.toDate) {
            text += '\n' + data.createdAt.toDate().toLocaleDateString();
          }
          viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(data.longitude, data.latitude),
            billboard: {
              image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="red"%3E%3Cpath d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/%3E%3C/svg%3E',
              width: 28,
              height: 28
            },
            label: {
              text: text,
              font: '12px sans-serif',
              fillColor: Cesium.Color.WHITE,
              backgroundColor: Cesium.Color.BLACK.withAlpha(0.7),
              style: Cesium.LabelStyle.FILL_AND_OUTLINE,
              outlineWidth: 2,
              verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
              pixelOffset: new Cesium.Cartesian2(0, -18)
            }
          });
        }
      });
    })
    .catch(function(err) {
      console.error('خطأ في تحميل الرسائل:', err);
    });
}
</script>

</body>
</html>
