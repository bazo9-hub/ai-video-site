<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazo – بسيط</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { margin:0; font-family:Arial; background:#1a1a2e; color:white; text-align:center; }
        #loginBox { padding:50px; }
        #appBox { display:none; height:100vh; }
        #map { height:90vh; width:100%; }
        input, button { padding:10px 20px; margin:5px; border-radius:8px; border:none; }
        button { background:#4CAF50; color:white; cursor:pointer; }
        #topBar { background:#0f0f0f; padding:10px; display:flex; justify-content:space-between; align-items:center; }
        .popup-text { font-size:14px; line-height:1.8; text-align:center; min-width:200px; color:#333; }
        .likes-count { color:#ff4757; font-weight:bold; }
        .action-btn { background:transparent; border:none; font-size:18px; cursor:pointer; padding:0 5px; }
        .like-btn { color:#ff4757; }
        .comment-btn { color:#1e90ff; }
        .delete-btn { color:#ff6348; }
        .comment-box { background:#f0f0f0; color:#333; padding:5px 10px; border-radius:5px; margin:5px 0; font-size:13px; text-align:left; }
    </style>
</head>
<body>

<div id="loginBox">
    <h1>🔐 Bazo</h1>
    <input id="email" placeholder="البريد الإلكتروني"><br>
    <input id="password" type="password" placeholder="كلمة المرور"><br>
    <button onclick="signup()">إنشاء حساب</button>
    <button onclick="login()">تسجيل دخول</button>
    <p id="status"></p>
</div>

<div id="appBox">
    <div id="topBar">
        <h2>🌍 Bazo</h2>
        <button onclick="logout()">تسجيل خروج</button>
    </div>
    <div id="map"></div>
</div>

<script>
    var firebaseConfig = {
        apiKey: "AIzaSyBS70yDWhJy0Dyga40Uhi4L1m_4017Fe6c",
        authDomain: "bazo-a36fe.firebaseapp.com",
        databaseURL: "https://bazo-a36fe-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "bazo-a36fe",
        storageBucket: "bazo-a36fe.firebasestorage.app",
        messagingSenderId: "91348188690",
        appId: "1:91348188690:web:32769b1826e9aa0b8f22cb",
        measurementId: "G-ES9JXGH44V"
    };
    firebase.initializeApp(firebaseConfig);
    var auth = firebase.auth();
    var db = firebase.firestore();
    var map, currentUser = null;

    window.signup = function() {
        var email = document.getElementById("email").value;
        var password = document.getElementById("password").value;
        auth.createUserWithEmailAndPassword(email, password)
            .then(function() { document.getElementById("status").innerText = "✅ تم إنشاء الحساب"; })
            .catch(function(e) { alert(e.message); });
    };
    window.login = function() {
        var email = document.getElementById("email").value;
        var password = document.getElementById("password").value;
        auth.signInWithEmailAndPassword(email, password)
            .then(function() { document.getElementById("status").innerText = "✅ تم تسجيل الدخول"; })
            .catch(function(e) { alert(e.message); });
    };
    window.logout = function() { auth.signOut(); };

    auth.onAuthStateChanged(function(user) {
        currentUser = user;
        if (user) {
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("appBox").style.display = "block";
            startMap(user);
        } else {
            document.getElementById("loginBox").style.display = "block";
            document.getElementById("appBox").style.display = "none";
        }
    });

    // ===== دوال الخريطة (الدبوس الافتراضي فقط) =====
    function startMap(user) {
        map = L.map('map', {
            center: [20, 0],
            zoom: 2,
            minZoom: 1,
            maxZoom: 18,
            maxBounds: [[-85, -180], [85, 180]],
            maxBoundsViscosity: 0.5
        });

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            noWrap: true,
            minZoom: 1,
            maxZoom: 18
        }).addTo(map);

        // موقع المستخدم (باستخدام الدبوس الافتراضي)
        navigator.geolocation.getCurrentPosition(function(pos) {
            var lat = pos.coords.latitude;
            var lng = pos.coords.longitude;
            map.setView([lat, lng], 13);
            L.marker([lat, lng]).addTo(map).bindPopup('📍 أنت هنا');
        }, function() {
            alert('لم نتمكن من جلب موقعك، لكنك تقدر تختار أي مكان.');
        });

        // الضغط على الخريطة لكتابة رسالة
        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;
            var msg = prompt('✍️ اكتب رسالتك لهذا المكان:');
            if (!msg) return;

            db.collection("messages").add({
                uid: user.uid,
                username: user.email || 'مجهول',
                latitude: lat,
                longitude: lng,
                message: msg,
                createdAt: new Date(),
                likes: 0,
                likedBy: []
            })
            .then(function() {
                alert('✅ تم حفظ رسالتك!');
                loadMessages(); // تحديث الخريطة
            })
            .catch(function(err) {
                alert('❌ فشل الحفظ: ' + err.message);
            });
        });

        loadMessages();
    }

    // ===== تحميل الرسائل وعرضها بالدبوس الافتراضي =====
    function loadMessages() {
        // نمسح العلامات القديمة
        map.eachLayer(function(layer) {
            if (!!layer.getPopup || !!layer._popup) {
                map.removeLayer(layer);
            }
        });

        // نعيد طبعة الخريطة
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            noWrap: true,
            minZoom: 1,
            maxZoom: 18
        }).addTo(map);

        // نعيد علامة موقع المستخدم (بنفس الدبوس)
        navigator.geolocation.getCurrentPosition(function(pos) {
            var lat = pos.coords.latitude;
            var lng = pos.coords.longitude;
            L.marker([lat, lng]).addTo(map).bindPopup('📍 أنت هنا');
        }, function() {});

        // جلب الرسائل من Firestore وعرضها
        db.collection("messages").get()
            .then(function(snapshot) {
                snapshot.forEach(function(doc) {
                    var data = doc.data();
                    var docId = doc.id;
                    if (data.latitude && data.longitude) {
                        var likes = data.likes || 0;
                        var isOwner = (currentUser && currentUser.uid === data.uid);

                        var popupContent =
                            '<div class="popup-text">' +
                            '<b>' + (data.username || 'مجهول') + '</b><br>' +
                            data.message + '<br>' +
                            '<span class="likes-count">❤️ ' + likes + '</span>' +
                            ' <button class="action-btn like-btn" onclick="toggleLike(\'' + docId + '\')">👍</button>' +
                            ' <button class="action-btn comment-btn" onclick="addComment(\'' + docId + '\')">💬</button>' +
                            (isOwner ? ' <button class="action-btn delete-btn" onclick="deleteMessage(\'' + docId + '\', \'' + data.uid + '\')">🗑️</button>' : '') +
                            '<br><small>' + (data.createdAt?.toDate?.()?.toLocaleDateString('ar-EG') || '') + '</small>' +
                            '<hr style="margin:5px 0;">' +
                            '<div id="comments-' + docId + '" style="text-align:left;font-size:13px;max-height:100px;overflow-y:auto;"><i>⏳ جاري التحميل...</i></div>' +
                            '</div>';

                        // نستخدم الدبوس الافتراضي (بدون تحديد أيقونة)
                        var marker = L.marker([data.latitude, data.longitude]).addTo(map);
                        marker.bindPopup(popupContent);

                        marker.on('popupopen', function() {
                            var container = document.getElementById('comments-' + docId);
                            if (container) {
                                container.innerHTML = '<i>⏳ جاري التحميل...</i>';
                                db.collection("messages").doc(docId).collection("comments")
                                    .orderBy("createdAt", "desc").limit(5).get()
                                    .then(function(commentSnap) {
                                        var html = "";
                                        if (commentSnap.empty) { html = '<i style="color:#888;">لا توجد تعليقات</i>'; } else {
                                            commentSnap.forEach(function(cDoc) {
                                                var cData = cDoc.data();
                                                html += '<div class="comment-box"><b>' + (cData.username || 'مجهول') + '</b>: ' + cData.text +
                                                    ' <small style="color:#999;">' + (cData.createdAt?.toDate?.()?.toLocaleDateString('ar-EG') || '') + '</small></div>';
                                            });
                                        }
                                        container.innerHTML = html;
                                    });
                            }
                        });
                    }
                });
            })
            .catch(function(err) { console.error('خطأ في تحميل الرسائل:', err); });
    }

    // ===== دوال التفاعل (إعجاب، تعليق، حذف) =====
    window.toggleLike = function(docId) {
        if (!currentUser) { alert("يجب تسجيل الدخول"); return; }
        var docRef = db.collection("messages").doc(docId);
        docRef.get().then(function(doc) {
            if (!doc.exists) return;
            var data = doc.data();
            var likedBy = data.likedBy || [];
            var index = likedBy.indexOf(currentUser.uid);
            var newLikes = data.likes || 0;
            if (index > -1) { likedBy.splice(index, 1); newLikes--; } else { likedBy.push(currentUser.uid); newLikes++; }
            docRef.update({ likes: newLikes, likedBy: likedBy }).then(function() { loadMessages(); });
        });
    };

    window.deleteMessage = function(docId, authorUid) {
        if (!currentUser) return;
        if (currentUser.uid !== authorUid) { alert("ليس لديك صلاحية"); return; }
        if (!confirm("هل أنت متأكد؟")) return;
        db.collection("messages").doc(docId).delete().then(function() { loadMessages(); });
    };

    window.addComment = function(docId) {
        if (!currentUser) { alert("يجب تسجيل الدخول"); return; }
        var commentText = prompt("💬 اكتب تعليقك:");
        if (!commentText) return;
        db.collection("messages").doc(docId).collection("comments").add({
            uid: currentUser.uid,
            username: currentUser.email || 'مجهول',
            text: commentText,
            createdAt: new Date()
        }).then(function() { loadMessages(); });
    };
</script>
</body>
</html>
