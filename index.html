<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazo - خريطة العالم</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:Arial;background:#1a1a2e;color:white;text-align:center}
#loginBox{padding:50px}
#appBox{display:none;height:100vh}
#map{height:90vh;width:100%}
input,button{padding:10px 20px;margin:5px;border-radius:8px;border:none}
button{background:#4CAF50;color:white;cursor:pointer}
#topBar{background:#0f0f0f;padding:10px;display:flex;justify-content:space-between;align-items:center;text-align:left}
</style>
</head>
<body>

<div id="loginBox">
  <h1>🔐 Bazo</h1>
  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="كلمة السر"><br>
  <button onclick="signup()">إنشاء حساب</button>
  <button onclick="login()">تسجيل دخول</button>
  <p id="status"></p>
</div>

<div id="appBox">
  <div id="topBar">
    <h2>🌍 Bazo</h2>
    <button onclick="logout()">تسجيل خروج</button>
  </div>
  <div id="map"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyBS70yDWhJy0Dyga40Uhi4L1m_4017Fe6c",
  authDomain: "bazo-a36fe.firebaseapp.com",
  databaseURL: "https://bazo-a36fe-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bazo-a36fe",
  storageBucket: "bazo-a36fe.firebasestorage.app",
  messagingSenderId: "91348188690",
  appId: "1:91348188690:web:32769b1826e9aa0b8f22cb",
  measurementId: "G-ES9JXGH44V"
};

firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();

window.signup = function(){
  var email = document.getElementById("email").value;
  var password = document.getElementById("password").value;
  auth.createUserWithEmailAndPassword(email, password)
    .then(function(){
      document.getElementById("status").innerText = "✅ تم إنشاء الحساب";
    })
    .catch(function(e){
      alert(e.message);
    });
};

window.login = function(){
  var email = document.getElementById("email").value;
  var password = document.getElementById("password").value;
  auth.signInWithEmailAndPassword(email, password)
    .then(function(){
      document.getElementById("status").innerText = "✅ تم تسجيل الدخول";
    })
    .catch(function(e){
      alert(e.message);
    });
};

window.logout = function(){
  auth.signOut();
};

var map;

auth.onAuthStateChanged(function(user){
  if(user){
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("appBox").style.display = "block";
    startMap(user);
  } else {
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("appBox").style.display = "none";
  }
});

function startMap(user){
  // إنشاء الخريطة مع خيارات لمنع التكرار
  map = L.map('map', {
    center: [20, 0],
    zoom: 3,
    minZoom: 1,
    maxZoom: 18,
    zoomControl: true,
    maxBounds: [[-85, -180], [85, 180]],
    maxBoundsViscosity: 0.5
  });

  // طبقة الخريطة مع noWrap عشان نمنع التكرار
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    noWrap: true,
    minZoom: 1,
    maxZoom: 18
  }).addTo(map);

  // موقع المستخدم
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat = pos.coords.latitude;
    var lng = pos.coords.longitude;
    map.setView([lat, lng], 13);
    L.marker([lat, lng]).addTo(map).bindPopup('📍 أنت هنا');
  }, function(){
    alert('لم نتمكن من جلب موقعك، لكنك تقدر تختار أي مكان.');
  });

  // الضغط على الخريطة لكتابة رسالة
  map.on('click', function(e){
    var lat = e.latlng.lat;
    var lng = e.latlng.lng;
    var msg = prompt('✍️ اكتب رسالتك لهذا المكان:');
    if(!msg) return;

    db.collection("messages").add({
      uid: user.uid,
      username: user.email || 'مجهول',
      latitude: lat,
      longitude: lng,
      message: msg,
      createdAt: new Date()
    })
    .then(function(){
      alert('✅ تم حفظ رسالتك!');
      var marker = L.marker([lat, lng]).addTo(map);
      marker.bindPopup("<b>" + user.email + "</b><br>" + msg);
    })
    .catch(function(err){
      alert('❌ فشل الحفظ: ' + err.message);
    });
  });

  // تحميل الرسائل القديمة
  loadMessages();
}

function loadMessages(){
  db.collection("messages").get()
    .then(function(snapshot){
      snapshot.forEach(function(doc){
        var data = doc.data();
        if(data.latitude && data.longitude){
          var marker = L.marker([data.latitude, data.longitude]).addTo(map);
          var text = "<b>" + (data.username || 'مجهول') + "</b><br>" + data.message;
          if(data.createdAt && data.createdAt.toDate){
            text += "<br><small>" + data.createdAt.toDate().toLocaleDateString() + "</small>";
          }
          marker.bindPopup(text);
        }
      });
    })
    .catch(function(err){
      console.error('خطأ في تحميل الرسائل:', err);
    });
}
</script>

</body>
</html>
