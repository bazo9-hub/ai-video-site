<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bazo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ===== الأساسيات ===== */
* { box-sizing: border-box; }
:root {
  --bg: #1a1a2e;
  --bg2: #2d2d44;
  --text: white;
  --text2: #ddd;
  --border: #444;
  --card: #252540;
  --shadow: rgba(0,0,0,0.5);
  --input-bg: #1a1a2e;
  --input-text: white;
}
body.light {
  --bg: #f0f2f5;
  --bg2: #ffffff;
  --text: #1a1a2e;
  --text2: #333;
  --border: #ccc;
  --card: #ffffff;
  --shadow: rgba(0,0,0,0.1);
  --input-bg: #fff;
  --input-text: #333;
}
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background 0.3s, color 0.3s;
}
#loginBox { padding: 50px 20px; text-align: center; }
#appBox { display: none; height: 100vh; }
#mapPage { height: 100vh; display: block; }
#profilePage {
  display: none;
  padding: 20px 15px;
  text-align: left;
  max-width: 600px;
  margin: auto;
  height: 90vh;
  overflow-y: auto;
}
#map { height: 90vh; width: 100%; }
input, button, textarea {
  padding: 12px 20px;
  margin: 5px;
  border-radius: 10px;
  border: none;
  font-family: inherit;
  font-size: 14px;
}
input, textarea {
  background: var(--input-bg);
  color: var(--input-text);
  border: 1px solid var(--border);
  width: 100%;
  max-width: 350px;
}
textarea { height: 60px; resize: vertical; }
button {
  background: #4CAF50;
  color: white;
  cursor: pointer;
  transition: opacity 0.2s;
}
button:hover { opacity: 0.85; }
#topBar {
  background: var(--bg2);
  padding: 10px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  border-bottom: 1px solid var(--border);
}
#topBar button { margin: 2px; padding: 8px 14px; font-size: 13px; }
.action-btn {
  background: transparent;
  border: none;
  font-size: 18px;
  cursor: pointer;
  padding: 0 5px;
}
.like-btn { color: #ff4757; }
.comment-btn { color: #1e90ff; }
.delete-btn { color: #ff6348; }
.popup-text {
  font-size: 14px;
  line-height: 1.8;
  text-align: center;
  min-width: 200px;
  max-width: 280px;
  color: #333;
}
.likes-count { color: #ff4757; font-weight: bold; }
.comment-box {
  background: #f0f0f0;
  color: #333;
  padding: 5px 10px;
  border-radius: 5px;
  margin: 5px 0;
  font-size: 13px;
  text-align: left;
}
.profile-item {
  background: var(--bg2);
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  border-left: 4px solid #4CAF50;
}
.profile-item small { color: var(--text2); }
.back-btn { background: #555; }
.profile-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 3px solid #4CAF50;
  object-fit: cover;
  display: block;
  margin: 0 auto 10px;
}
.profile-field {
  background: var(--bg2);
  padding: 12px;
  border-radius: 8px;
  margin: 10px 0;
}
.profile-field label {
  display: block;
  font-weight: bold;
  color: var(--text2);
  font-size: 12px;
  margin-bottom: 3px;
}
.profile-field input,
.profile-field textarea {
  width: 100%;
  max-width: 300px;
  padding: 8px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: var(--input-bg);
  color: var(--input-text);
}
.profile-field .social-link {
  display: inline-block;
  margin: 3px 5px;
  padding: 5px 10px;
  background: #333;
  border-radius: 5px;
  color: white;
  text-decoration: none;
  font-size: 13px;
}
.theme-toggle {
  background: transparent;
  border: none;
  font-size: 24px;
  cursor: pointer;
  padding: 5px 10px;
}
/* ===== تحسينات الجوال ===== */
@media (max-width: 600px) {
  #topBar { flex-direction: column; align-items: stretch; text-align: center; }
  #topBar h2 { margin: 5px 0; }
  #topBar div { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
  .popup-text { min-width: 150px; max-width: 220px; font-size: 13px; }
  input, button { font-size: 16px; padding: 14px 20px; }
  #profilePage { padding: 15px; }
}
</style>
</head>
<body>

<!-- ===== تسجيل الدخول ===== -->
<div id="loginBox">
  <h1>🔐 Bazo</h1>
  <input id="email" placeholder="البريد الإلكتروني"><br>
  <input id="password" type="password" placeholder="كلمة المرور"><br>
  <button onclick="signup()">إنشاء حساب</button>
  <button onclick="login()">تسجيل دخول</button>
  <p id="status"></p>
</div>

<!-- ===== التطبيق ===== -->
<div id="appBox">
  <div id="topBar">
    <h2>🌍 Bazo</h2>
    <div>
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
      <button onclick="showProfile()">👤 حسابي</button>
      <button onclick="logout()">تسجيل خروج</button>
    </div>
  </div>
  
  <div id="mapPage"><div id="map"></div></div>

  <div id="profilePage">
    <button onclick="goToMap()" class="back-btn">🔙 رجوع للخريطة</button>
    <h2>👤 الملف الشخصي</h2>
    <img id="profileAvatar" class="profile-avatar" src="https://ui-avatars.com/api/?name=مستخدم&background=4CAF50&color=fff&size=80" alt="صورة">
    <div class="profile-field">
      <label>اسم المستخدم</label>
      <input id="profileUsername" placeholder="اكتب اسمك">
    </div>
    <div class="profile-field">
      <label>نبذة عنك</label>
      <textarea id="profileBio" placeholder="اكتب نبذة عنك..."></textarea>
    </div>
    <div class="profile-field">
      <label>العمر</label>
      <input id="profileAge" type="number" placeholder="مثلاً: 25">
    </div>
    <div class="profile-field">
      <label>المدينة/الدولة</label>
      <input id="profileLocation" placeholder="مثلاً: دبي، الإمارات">
    </div>
    <div class="profile-field">
      <label>روابط حساباتك</label>
      <input id="profileSocial" placeholder="فيسبوك, تويتر, إنستغرام (بينهم فاصلة)">
    </div>
    <button onclick="saveProfile()" style="background:#2196F3;">💾 حفظ</button>
    <button onclick="resetProfile()" style="background:#f44336;">🔄 إعادة تعيين</button>
    <hr>
    <h3>📝 رسائلي</h3>
    <div id="profileMessages"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyBS70yDWhJy0Dyga40Uhi4L1m_4017Fe6c",
  authDomain: "bazo-a36fe.firebaseapp.com",
  databaseURL: "https://bazo-a36fe-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bazo-a36fe",
  storageBucket: "bazo-a36fe.firebasestorage.app",
  messagingSenderId: "91348188690",
  appId: "1:91348188690:web:32769b1826e9aa0b8f22cb",
  measurementId: "G-ES9JXGH44V"
};

firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();
var map, currentUser = null;

// ===== دوال الحساب =====
window.signup = function(){
  var email = document.getElementById("email").value;
  var password = document.getElementById("password").value;
  auth.createUserWithEmailAndPassword(email, password)
    .then(function(){ document.getElementById("status").innerText = "✅ تم إنشاء الحساب"; })
    .catch(function(e){ alert(e.message); });
};
window.login = function(){
  var email = document.getElementById("email").value;
  var password = document.getElementById("password").value;
  auth.signInWithEmailAndPassword(email, password)
    .then(function(){ document.getElementById("status").innerText = "✅ تم تسجيل الدخول"; })
    .catch(function(e){ alert(e.message); });
};
window.logout = function(){ auth.signOut(); };

// ===== تبديل الوضع الليلي =====
window.toggleTheme = function() {
  document.body.classList.toggle('light');
  var btn = document.getElementById('themeBtn');
  if(document.body.classList.contains('light')) {
    btn.textContent = '☀️';
    localStorage.setItem('theme', 'light');
  } else {
    btn.textContent = '🌙';
    localStorage.setItem('theme', 'dark');
  }
};
// تحميل الوضع المحفوظ
(function() {
  var theme = localStorage.getItem('theme');
  if(theme === 'light') {
    document.body.classList.add('light');
    document.getElementById('themeBtn').textContent = '☀️';
  }
})();

auth.onAuthStateChanged(function(user){
  currentUser = user;
  if(user){
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("appBox").style.display = "block";
    loadUserProfile();
    startMap(user);
  } else {
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("appBox").style.display = "none";
  }
});

window.goToMap = function() {
  document.getElementById("mapPage").style.display = "block";
  document.getElementById("profilePage").style.display = "none";
  if(map) map.invalidateSize();
};
window.showProfile = function() {
  document.getElementById("mapPage").style.display = "none";
  document.getElementById("profilePage").style.display = "block";
  loadProfile();
};

// ===== تحميل بيانات المستخدم =====
function loadUserProfile() {
  if(!currentUser) return;
  db.collection("users").doc(currentUser.uid).get().then(function(doc) {
    if(doc.exists) {
      var data = doc.data();
      document.getElementById("profileUsername").value = data.username || '';
      document.getElementById("profileBio").value = data.bio || '';
      document.getElementById("profileAge").value = data.age || '';
      document.getElementById("profileLocation").value = data.location || '';
      document.getElementById("profileSocial").value = data.socialLinks || '';
      if(data.avatar) { document.getElementById("profileAvatar").src = data.avatar; }
    } else {
      document.getElementById("profileUsername").value = currentUser.email.split('@')[0] || 'مستخدم';
    }
  }).catch(function(err){ console.error(err); });
}

window.saveProfile = function() {
  if(!currentUser) return;
  var username = document.getElementById("profileUsername").value.trim();
  if(!username) { alert("يرجى كتابة اسم المستخدم"); return; }
  db.collection("users").doc(currentUser.uid).set({
    username: username,
    bio: document.getElementById("profileBio").value.trim(),
    age: document.getElementById("profileAge").value,
    location: document.getElementById("profileLocation").value.trim(),
    socialLinks: document.getElementById("profileSocial").value.trim(),
    avatar: document.getElementById("profileAvatar").src,
    email: currentUser.email,
    updatedAt: new Date()
  }, { merge: true }).then(function() {
    alert("✅ تم الحفظ!");
    loadMessages();
  }).catch(function(err){ alert("❌ فشل: " + err.message); });
};

window.resetProfile = function() {
  if(!confirm("هل أنت متأكد؟")) return;
  db.collection("users").doc(currentUser.uid).delete().then(function() {
    document.getElementById("profileUsername").value = '';
    document.getElementById("profileBio").value = '';
    document.getElementById("profileAge").value = '';
    document.getElementById("profileLocation").value = '';
    document.getElementById("profileSocial").value = '';
    document.getElementById("profileAvatar").src = 'https://ui-avatars.com/api/?name=مستخدم&background=4CAF50&color=fff&size=80';
    alert("🔄 تم إعادة التعيين");
  }).catch(function(err){ alert("❌ فشل: " + err.message); });
};

function loadProfile() {
  if(!currentUser) return;
  db.collection("users").doc(currentUser.uid).get().then(function(doc) {
    if(doc.exists) {
      var data = doc.data();
      var username = data.username || currentUser.email.split('@')[0];
      document.querySelector('#profilePage h2').innerHTML = '👤 ' + username;
    }
  }).catch(function(err){ console.error(err); });

  db.collection("messages").where("uid", "==", currentUser.uid).get()
    .then(function(snapshot) {
      var count = 0, totalLikes = 0, html = "";
      snapshot.forEach(function(doc) {
        var data = doc.data();
        count++;
        totalLikes += (data.likes || 0);
        html += '<div class="profile-item"><b>' + data.message + '</b><br><small>📍 ' + data.latitude.toFixed(4) + ', ' + data.longitude.toFixed(4) + '</small><br><small>❤️ ' + (data.likes || 0) + ' إعجاب</small></div>';
      });
      document.getElementById("profileCount").innerHTML = '<strong>عدد رسائلي:</strong> ' + count;
      document.getElementById("profileLikes").innerHTML = '<strong>❤️ إجمالي الإعجابات:</strong> ' + totalLikes;
      document.getElementById("profileMessages").innerHTML = html || "لا توجد رسائل بعد.";
    }).catch(function(err){ console.error(err); });
}

// ===== دوال التفاعل =====
function getUsername(callback) {
  if(!currentUser) { callback('مجهول'); return; }
  db.collection("users").doc(currentUser.uid).get().then(function(doc) {
    if(doc.exists && doc.data().username) { callback(doc.data().username); }
    else { callback(currentUser.email.split('@')[0]); }
  }).catch(function(){ callback(currentUser.email.split('@')[0]); });
}

window.toggleLike = function(docId) {
  if (!currentUser) { alert("يجب تسجيل الدخول"); return; }
  var docRef = db.collection("messages").doc(docId);
  docRef.get().then(function(doc) {
    if (!doc.exists) return;
    var data = doc.data();
    var likedBy = data.likedBy || [];
    var index = likedBy.indexOf(currentUser.uid);
    var newLikes = data.likes || 0;
    if (index > -1) { likedBy.splice(index, 1); newLikes--; }
    else { likedBy.push(currentUser.uid); newLikes++; }
    docRef.update({ likes: newLikes, likedBy: likedBy }).then(function() { loadMessages(); });
  });
};

window.deleteMessage = function(docId, authorUid) {
  if (!currentUser) return;
  if (currentUser.uid !== authorUid) { alert("ليس لديك صلاحية"); return; }
  if (!confirm("هل أنت متأكد؟")) return;
  db.collection("messages").doc(docId).delete().then(function(){ loadMessages(); });
};

window.addComment = function(docId) {
  if (!currentUser) { alert("يجب تسجيل الدخول"); return; }
  var commentText = prompt("💬 اكتب تعليقك:");
  if (!commentText) return;
  getUsername(function(username) {
    db.collection("messages").doc(docId).collection("comments").add({
      uid: currentUser.uid,
      username: username || 'مجهول',
      text: commentText,
      createdAt: new Date()
    }).then(function(){ loadMessages(); });
  });
};

// ===== تشغيل الخريطة =====
function startMap(user){
  map = L.map('map', { center: [20, 0], zoom: 2, minZoom: 1, maxZoom: 18, maxBounds: [[-85,-180],[85,180]], maxBoundsViscosity: 0.5 });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', noWrap: true, minZoom: 1, maxZoom: 18 }).addTo(map);
  navigator.geolocation.getCurrentPosition(function(pos){
    map.setView([pos.coords.latitude, pos.coords.longitude], 13);
    L.marker([pos.coords.latitude, pos.coords.longitude]).addTo(map).bindPopup('📍 أنت هنا');
  }, function(){});
  map.on('click', function(e){
    var msg = prompt('✍️ اكتب رسالتك لهذا المكان:');
    if(!msg) return;
    getUsername(function(username) {
      db.collection("messages").add({
        uid: user.uid,
        username: username || user.email.split('@')[0],
        latitude: e.latlng.lat,
        longitude: e.latlng.lng,
        message: msg,
        createdAt: new Date(),
        likes: 0,
        likedBy: []
      }).then(function(){ loadMessages(); });
    });
  });
  loadMessages();
}

function loadMessages(){
  map.eachLayer(function(layer){ if(!!layer.getPopup || !!layer._popup){ map.removeLayer(layer); } });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', noWrap: true, minZoom: 1, maxZoom: 18 }).addTo(map);
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos){
      L.marker([pos.coords.latitude, pos.coords.longitude]).addTo(map).bindPopup('📍 أنت هنا');
    }, function(){});
  }
  db.collection("messages").get().then(function(snapshot){
    snapshot.forEach(function(doc){
      var data = doc.data(), docId = doc.id;
      if(data.latitude && data.longitude){
        var likes = data.likes || 0;
        var isOwner = (currentUser && currentUser.uid === data.uid);
        var popupContent = 
          '<div class="popup-text">' +
          '<b>' + (data.username || 'مجهول') + '</b><br>' +
          data.message + '<br>' +
          '<span class="likes-count">❤️ ' + likes + '</span>' +
          ' <button class="action-btn like-btn" onclick="toggleLike(\'' + docId + '\')">👍</button>' +
          ' <button class="action-btn comment-btn" onclick="addComment(\'' + docId + '\')">💬</button>' +
          (isOwner ? ' <button class="action-btn delete-btn" onclick="deleteMessage(\'' + docId + '\', \'' + data.uid + '\')">🗑️</button>' : '') +
          '<br><small>' + (data.createdAt?.toDate?.()?.toLocaleDateString('ar-EG') || '') + '</small>' +
          '<hr style="margin:5px 0;">' +
          '<div id="comments-' + docId + '" style="text-align:left;font-size:13px;max-height:100px;overflow-y:auto;"><i>⏳ جاري التحميل...</i></div>' +
          '</div>';
        var marker = L.marker([data.latitude, data.longitude]).addTo(map);
        marker.bindPopup(popupContent);
        marker.on('popupopen', function() {
          var container = document.getElementById('comments-' + docId);
          if(container) {
            container.innerHTML = '<i>⏳ جاري التحميل...</i>';
            db.collection("messages").doc(docId).collection("comments")
              .orderBy("createdAt", "desc").limit(5).get()
              .then(function(commentSnap) {
                var html = "";
                if(commentSnap.empty) { html = '<i style="color:#888;">لا توجد تعليقات</i>'; } else {
                  commentSnap.forEach(function(cDoc) {
                    var cData = cDoc.data();
                    html += '<div class="comment-box"><b>' + (cData.username || 'مجهول') + '</b>: ' + cData.text +
                            ' <small style="color:#999;">' + (cData.createdAt?.toDate?.()?.toLocaleDateString('ar-EG') || '') + '</small></div>';
                  });
                }
                container.innerHTML = html;
              }).catch(function(err){ container.innerHTML = '<i style="color:red;">خطأ في التحميل</i>'; });
          }
        });
      }
    });
  }).catch(function(err){ console.error(err); });
}
</script>
</body>
</html>
