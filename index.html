<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazo - مع الإعجابات ❤️</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:Arial;background:#1a1a2e;color:white;text-align:center}
#loginBox{padding:50px}
#appBox{display:none;height:100vh}
#map{height:90vh;width:100%}
input,button{padding:10px 20px;margin:5px;border-radius:8px;border:none}
button{background:#4CAF50;color:white;cursor:pointer}
#topBar{background:#0f0f0f;padding:10px;display:flex;justify-content:space-between;align-items:center;text-align:left}
.like-btn{background:transparent;border:none;font-size:18px;cursor:pointer;padding:0 8px;color:#ff4757}
.like-btn:hover{transform:scale(1.2)}
.popup-text{font-size:14px;line-height:1.6;text-align:center;min-width:150px}
.popup-text .likes-count{color:#ff4757;font-weight:bold}
</style>
</head>
<body>

<div id="loginBox">
  <h1>🔐 Bazo</h1>
  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="كلمة السر"><br>
  <button onclick="signup()">إنشاء حساب</button>
  <button onclick="login()">تسجيل دخول</button>
  <p id="status"></p>
</div>

<div id="appBox">
  <div id="topBar">
    <h2>🌍 Bazo</h2>
    <button onclick="logout()">تسجيل خروج</button>
  </div>
  <div id="map"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyBS70yDWhJy0Dyga40Uhi4L1m_4017Fe6c",
  authDomain: "bazo-a36fe.firebaseapp.com",
  databaseURL: "https://bazo-a36fe-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bazo-a36fe",
  storageBucket: "bazo-a36fe.firebasestorage.app",
  messagingSenderId: "91348188690",
  appId: "1:91348188690:web:32769b1826e9aa0b8f22cb",
  measurementId: "G-ES9JXGH44V"
};

firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();

window.signup = function(){
  var email = document.getElementById("email").value;
  var password = document.getElementById("password").value;
  auth.createUserWithEmailAndPassword(email, password)
    .then(function(){ document.getElementById("status").innerText = "✅ تم إنشاء الحساب"; })
    .catch(function(e){ alert(e.message); });
};

window.login = function(){
  var email = document.getElementById("email").value;
  var password = document.getElementById("password").value;
  auth.signInWithEmailAndPassword(email, password)
    .then(function(){ document.getElementById("status").innerText = "✅ تم تسجيل الدخول"; })
    .catch(function(e){ alert(e.message); });
};

window.logout = function(){ auth.signOut(); };

var map;
var currentUser = null;

auth.onAuthStateChanged(function(user){
  currentUser = user;
  if(user){
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("appBox").style.display = "block";
    startMap(user);
  } else {
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("appBox").style.display = "none";
  }
});

// ===== دالة الإعجاب =====
window.likeMessage = function(docId, currentLikes) {
  if (!currentUser) {
    alert("يجب تسجيل الدخول للإعجاب");
    return;
  }

  var docRef = db.collection("messages").doc(docId);
  
  // نجيب المستند عشان نتأكد إن المستخدم ما أعجب قبل كذا
  docRef.get().then(function(doc) {
    if (doc.exists) {
      var data = doc.data();
      var likedBy = data.likedBy || [];
      
      // إذا المستخدم موجود في القائمة، يعني سبق أعجب
      if (likedBy.includes(currentUser.uid)) {
        alert("لقد أعجبت بهذه الرسالة مسبقاً ❤️");
        return;
      }
      
      // نضيف المستخدم لقائمة المعجبين ونزيد العدد
      likedBy.push(currentUser.uid);
      var newLikes = (data.
                      likes || 0) + 1;
      
      docRef.update({
        likes: newLikes,
        likedBy: likedBy
      }).then(function() {
        alert("✅ تم الإعجاب!");
        // نحدث العدد في الشاشة (نعيد تحميل الرسائل)
        loadMessages();
      }).catch(function(err) {
        alert("❌ فشل الإعجاب: " + err.message);
      });
    }
  }).catch(function(err) {
    alert("❌ خطأ: " + err.message);
  });
};

// ===== تشغيل الخريطة =====
function startMap(user){
  map = L.map('map', {
    center: [20, 0],
    zoom: 2,
    minZoom: 1,
    maxZoom: 18,
    maxBounds: [[-85, -180], [85, 180]],
    maxBoundsViscosity: 0.5
  });

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    noWrap: true,
    minZoom: 1,
    maxZoom: 18
  }).addTo(map);

  navigator.geolocation.getCurrentPosition(function(pos){
    var lat = pos.coords.latitude;
    var lng = pos.coords.longitude;
    map.setView([lat, lng], 13);
    L.marker([lat, lng]).addTo(map).bindPopup('📍 أنت هنا');
  }, function(){
    alert('لم نتمكن من جلب موقعك، لكنك تقدر تختار أي مكان.');
  });

  map.on('click', function(e){
    var lat = e.latlng.lat;
    var lng = e.latlng.lng;
    var msg = prompt('✍️ اكتب رسالتك لهذا المكان:');
    if(!msg) return;

    db.collection("messages").add({
      uid: user.uid,
      username: user.email || 'مجهول',
      latitude: lat,
      longitude: lng,
      message: msg,
      createdAt: new Date(),
      likes: 0,
      likedBy: []
    })
    .then(function(docRef){
      alert('✅ تم حفظ رسالتك!');
      loadMessages(); // نعيد تحميل كل الرسائل عشان تظهر مع الزر
    })
    .catch(function(err){ alert('❌ فشل الحفظ: ' + err.message); });
  });

  loadMessages();
}

// ===== جلب الرسائل وعرضها مع زر الإعجاب =====
function loadMessages(){
  // نحذف جميع العلامات القديمة (نظف الخريطة عشان ما تتكرر)
  map.eachLayer(function(layer){
    if(!!layer.getPopup){
      map.removeLayer(layer);
    }
  });

  // نضيف طبقة الخريطة مرة ثانية (لأننا حذفناها مع العلامات)
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    noWrap: true,
    minZoom: 1,
    maxZoom: 18
  }).addTo(map);

  // نعيد إضافة علامة "أنت هنا" إذا كان الموقع معروف
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos){
      var lat = pos.coords.latitude;
      var lng = pos.coords.longitude;
      L.marker([lat, lng]).addTo(map).bindPopup('📍 أنت هنا');
    }, function(){});
  }

  db.collection("messages").get()
    .then(function(snapshot){
      snapshot.forEach(function(doc){
        var data = doc.data();
        var docId = doc.id;
        if(data.latitude && data.longitude){
          var likes = data.likes || 0;
          
          // نصنع محتوى البوب أب
          var popupContent = 
            '<div class="popup-text">' +
            '<b>' + (data.username || 'مجهول') + '</b><br>' +
            data.message + '<br>' +
            '<span class="likes-count">❤️ ' + likes + '</span>' +
            ' <button class="like-btn" onclick="likeMessage(\'' + docId + '\',' + likes + ')">👍</button>' +
            '<br><small>' + (data.createdAt?.toDate?.()?.toLocaleDateString() || '') + '</small>' +
            '</div>';

          var marker = L.marker([data.latitude, data.longitude]).addTo(map);
          marker.bindPopup(popupContent);
        }
      });
    })
    .catch(function(err){ console.error('خطأ في تحميل الرسائل:', err); });
}
</script>
</body>
</html>
