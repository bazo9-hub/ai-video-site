<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazo</title>
<style>
body{
  margin:0;
  font-family: Arial;
  background: radial-gradient(circle at top, #1a1a2e, #0f0f0f);
  color:white;
  text-align:center;
  padding:50px;
}
input, button{
  padding:10px 20px;
  margin:5px;
  border-radius:8px;
  border:none;
}
button{
  background:#4CAF50;
  color:white;
  cursor:pointer;
}
button:hover{
  opacity:0.8;
}
#appBox{
  display:none;
}
</style>
</head>
<body>

<!-- ===== تسجيل الدخول ===== -->
<div id="loginBox">
  <h1>🔐 Bazo</h1>
  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="كلمة السر"><br>
  <button onclick="signup()">إنشاء حساب</button>
  <button onclick="login()">تسجيل دخول</button>
  <p id="status"></p>
</div>

<!-- ===== التطبيق ===== -->
<div id="appBox">
  <h1>🌍 Bazo</h1>
  <button onclick="logout()">تسجيل خروج</button>
  <hr>
  <h3>🧪 اختبار Firestore</h3>
  <button onclick="testSecret()" style="background:green; font-size:18px;">Test Firestore</button>
  <div id="result"></div>
</div>

<!-- ===== Firebase SDK ===== -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
// ===== إعدادات Firebase الخاصة بك (من الصورة) =====
const firebaseConfig = {
  apiKey: "AIzaSyBS70yDWhJy0Dyga40Uhi4L1m_4017Fe6c",
  authDomain: "bazo-a36fe.firebaseapp.com",
  databaseURL: "https://bazo-a36fe-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bazo-a36fe",
  storageBucket: "bazo-a36fe.firebasestorage.app",
  messagingSenderId: "91348188690",
  appId: "1:91348188690:web:32769b1826e9aa0b8f22cb",
  measurementId: "G-ES9JXGH44V"
};

// تشغيل Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// ===== دوال تسجيل الدخول =====
window.signup = function(){
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;
  auth.createUserWithEmailAndPassword(email, password)
    .then(() => document.getElementById("status").innerText = "✅ تم إنشاء الحساب")
    .catch(e => alert(e.message));
};

window.login = function(){
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;
  auth.signInWithEmailAndPassword(email, password)
    .then(() => document.getElementById("status").innerText = "✅ تم تسجيل الدخول")
    .catch(e => alert(e.message));
};

window.logout = function(){
  auth.signOut();
};

// ===== تبديل الواجهة =====
auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("appBox").style.display = "block";
  } else {
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("appBox").style.display = "none";
  }
});

// ===== زر TEST FIRESTORE (يعمل الآن) =====
window.testSecret = async function(){
  alert("🟢 Button works");

  try {
    const db = firebase.firestore();
    await db.collection("secrets").add({
      message: "Hello World",
      createdAt: new Date()
    });
    alert("✅ تم الحفظ في Firestore!");
    document.getElementById("result").innerHTML = "✅ تم الحفظ بنجاح";
  } catch (err) {
    alert("❌ خطأ: " + err.message);
    document.getElementById("result").innerHTML = "❌ فشل الحفظ: " + err.message;
  }
};
</script>

</body>
</html>
